<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday Asia 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#ffd6ec,#ffeef7);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.box{
background:white;
width:90%;
max-width:420px;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
animation:fade 1s;
}

h1{
color:#ff4f93;
}

p{
font-size:18px;
}

input{
width:80%;
padding:12px;
font-size:20px;
border-radius:10px;
border:2px solid pink;
text-align:center;
margin-top:15px;
}

button{
margin-top:20px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:15px;
cursor:pointer;
background:#ff4f93;
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

@keyframes fade{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}
</style>

</head>

<body>

<div class="box">

<h1>🎁 عندي ليك مفاجأة 🎁</h1>

<p>دخلي الكود باش تفتحي المفاجأة 💖</p>

<input id="code" placeholder="2011">

<br>

<button onclick="checkCode()">دخول</button>

<p id="msg"></p>

</div>

<script>

function checkCode(){

let code=document.getElementById("code").value;

if(code=="2011"){

window.location="envelope.html";

}else{

document.getElementById("msg").innerHTML="❌ الكود غلط";

}

}

</script>

</body>
</html>
